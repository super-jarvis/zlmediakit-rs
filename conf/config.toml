# ZLMediaKit-RS Configuration File

# API/stream token auth. When enabled, publish/play requests must carry a
# `?sign=` query parameter. sign = sha256(secret | vhost | app | stream | action)
# where action is "pub" (publish) or "play". The secret below is also used by
# the management API. Default secret is generated if omitted.
auth_enabled = false
secret = "035c73f7-bb6b-4889-a715-d9eb2d1925cc"

# General settings
[general]
flow_threshold = 1024
stream_none_reader_delay = 10

# RTMP server
[rtmp]
enabled = true
port = 1935
ssl = false

# RTSP server
[rtsp]
enabled = true
port = 554
ssl = false
tcp_mode = true

# HTTP server
[http]
enabled = true
port = 80
ssl = false
dir_root = true

# WebRTC (WHEP playback) server. A browser plays a published stream over
# WebRTC by POSTing an SDP offer to /webrtc/play/<vhost>/<app>/<stream> (or
# with ?vhost=&app=&stream= query params) and DELETEing the returned Location
# to stop. Currently playback (WHEP) only; H.264 video and Opus audio.
[webrtc]
enabled = true
port = 9000

# Record settings
[record]
app = "record"
hls = false
mp4 = false
flv = false
