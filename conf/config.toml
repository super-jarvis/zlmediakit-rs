# ZLMediaKit-RS Configuration File

# API/stream token auth. When enabled, publish/play requests must carry a
# `?sign=` query parameter. sign = sha256(secret | vhost | app | stream | action)
# where action is "pub" (publish) or "play". The secret below is also used by
# the management API. Default secret is generated if omitted.
auth_enabled = false
secret = "035c73f7-bb6b-4889-a715-d9eb2d1925cc"

# General settings
[general]
flow_threshold = 1024
stream_none_reader_delay = 10

# RTMP server
[rtmp]
enabled = true
port = 1935
ssl = false

# RTSP server
[rtsp]
enabled = true
port = 8554
ssl = false
tcp_mode = true

# HTTP server
[http]
enabled = true
port = 8080
ssl = false
dir_root = true
www_root = "./www"

# WebRTC (WHEP playback) server. A browser plays a published stream over
# WebRTC by POSTing an SDP offer to /webrtc/play/<vhost>/<app>/<stream> (or
# with ?vhost=&app=&stream= query params) and DELETEing the returned Location
# to stop. Currently playback (WHEP) only; H.264 video and Opus audio.
[webrtc]
enabled = true
port = 9000
# ICE servers for NAT traversal. Empty = host candidates only (same LAN /
# open Internet). Uncomment to enable STUN and/or TURN:
# ice_servers = [
#   { urls = ["stun:stun.l.google.com:19302"] },
#   { urls = ["turn:turn.example.com:3478?transport=udp"], username = "user", credential = "pass" },
# ]
ice_servers = []

# Optional AAC->Opus audio transcoding for WebRTC playback is behind the
# `transcode` Cargo feature (needs libopus / libfdk-aac at build time):
#   cargo build --features zlmediakit-webrtc/transcode,zlmediakit-webrtc/aac-transcode

# Optional HTTP callbacks to an external auth/notification service.
# When configured, the server POSTs to the given URL before allowing
# publish/play. The service should respond with JSON `{"code": 0}` to
# allow or `{"code": -1, "msg": "reason"}` to deny.
# POST parameters: vhost, app, stream, params
# Unconfigured hooks are skipped (allow by default).
#[hook]
#on_publish = "http://127.0.0.1:8080/index/hook/on_publish"
#on_play = "http://127.0.0.1:8080/index/hook/on_play"
#on_stream_not_found = "http://127.0.0.1:8080/index/hook/on_stream_not_found"
#timeout_sec = 5
#retry = 1

# SRT (Secure Reliable Transport) ingest server.
# Accepts SRT push streams and publishes them to the MediaSourceManager.
# Uses libsrt (must be installed: apt install libsrt-gnutls-dev).
#[srt]
#enabled = false
#port = 9000
#latency_ms = 120
#passphrase = ""  # optional encryption

# Cluster push relay: when a local stream is published, automatically push
# it to remote RTMP servers. Each peer entry specifies the remote URL and
# optional vhost/app overrides.
#[cluster]
#enabled = false
#push_to = [
#  { url = "rtmp://192.168.1.10/live" },
#  { url = "rtmp://192.168.1.11/live", vhost = "__defaultVhost__", app = "live" },
#]

# Stream proxy: automatically pull remote streams on startup.
#[proxy]
#enabled = false
#pulls = [
#  { url = "rtmp://192.168.1.100/live/camera1" },
#]

# Record settings
[record]
app = "record"
hls = false
mp4 = false
flv = false
