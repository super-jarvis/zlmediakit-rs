[package]
name = "zlmediakit-server"
description = "ZLMediaKit-RS streaming media server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "zlmediakit"
path = "src/main.rs"

[dependencies]
zlmediakit-core = { path = "../core" }
zlmediakit-codec = { path = "../codec" }
zlmediakit-rtmp = { path = "../rtmp" }
zlmediakit-rtsp = { path = "../rtsp" }
zlmediakit-http = { path = "../http" }
zlmediakit-flv = { path = "../flv" }
zlmediakit-hls = { path = "../hls" }
zlmediakit-mp4 = { path = "../mp4" }
zlmediakit-srt = { path = "../srt" }
zlmediakit-webrtc = { path = "../webrtc" }
tokio.workspace = true
bytes.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
clap = { version = "4", features = ["derive"] }
