# ============================================================
#  自动构建并发布 Docker 镜像到 GitHub Container Registry
#
#  触发条件:
#    - push 到 master 分支 → 发布 latest 标签
#    - push 任何 tag (v*) → 发布版本标签
#
#  镜像地址: ghcr.io/<your-github-username>/zlmediakit-rs
#  拉取: docker pull ghcr.io/<your-github-username>/zlmediakit-rs:latest
# ============================================================

name: Docker Publish

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  # 允许手动触发
  workflow_dispatch:

env:
  # 镜像名称（自动使用仓库名的小写形式）
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # 允许推送镜像到 GHCR

    steps:
      # ----------------------------------------------------
      # 1. 检出代码
      # ----------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v6

      # ----------------------------------------------------
      # 2. 登录 GitHub Container Registry
      # ----------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------
      # 3. 提取镜像标签元数据
      # ----------------------------------------------------
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # 分支 push → :latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
            # tag push → :v1.0.0
            type=semver,pattern={{version}}
            # tag push → :v1.0
            type=semver,pattern={{major}}.{{minor}}
            # 短 commit SHA
            type=sha,prefix=sha-,format=short

      # ----------------------------------------------------
      # 4. 构建并推送镜像
      # ----------------------------------------------------
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 可选：开启转码特性
          # build-args: |
          #   BUILD_FEATURES=zlmediakit-webrtc/transcode,zlmediakit-webrtc/aac-transcode
