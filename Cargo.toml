[workspace]
members = [
    "crates/core",
    "crates/codec",
    "crates/rtmp",
    "crates/rtsp",
    "crates/http",
    "crates/flv",
    "crates/hls",
    "crates/mp4",
    "crates/server",
    "crates/srt",
    "crates/transcode",
    "crates/webrtc",
]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["zlmediakit-rs contributors"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
socket2 = { version = "0.6", features = ["all"] }
bytes = "1"
bytes-utils = "0.1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
dashmap = "6"
arc-swap = "1"
parking_lot = "0.12"
futures = "0.3"
async-trait = "0.1"
hmac = "0.13"
sha2 = "0.11"
sha1 = "0.10"
base64 = "0.23"
rand = "0.10"
hex = "0.4"
log = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
webpki-roots = "1"
rcgen = "0.13"
